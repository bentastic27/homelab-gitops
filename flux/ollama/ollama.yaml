apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux
spec:
  interval: 10m0s
  retryInterval: 1m0s
  path: "./flux/ollama/manifests"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux
  dependsOn:
  - name: istio
  - name: ollama-secrets
  postBuild:
    substituteFrom:
    - kind: Secret
      name: ollama-api-key
