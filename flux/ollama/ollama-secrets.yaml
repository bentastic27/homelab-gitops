apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-secrets
  namespace: flux
spec:
  interval: 10m0s
  retryInterval: 1m0s
  path: "./flux/ollama/secrets"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux
  dependsOn:
  - name: kubernetes-secret-generator
