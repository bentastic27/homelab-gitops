# Settings for the nocodb pod and the postgres statefulset; the generated
# passwords are defined once here. NC_DB is assembled in nocodb.yaml because
# it embeds DATABASE_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: nocodb-env
  namespace: nocodb
  annotations:
    secret-generator.v1.mittwald.de/type: string
    secret-generator.v1.mittwald.de/secure: "yes"
    secret-generator.v1.mittwald.de/autogenerate: DATABASE_PASSWORD,NC_ADMIN_PASSWORD,NC_AUTH_JWT_SECRET
stringData:
  DATABASE_USER: nocodb
  DATABASE_NAME: nocodb
  NC_ADMIN_EMAIL: admin@beansnet.net
