apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nocodb-http
  namespace: nocodb
spec:
  parentRefs:
  - name: internal-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: https
  hostnames:
  - nocodb.int.beansnet.net
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nocodb
      port: 80
