apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone
  namespace: nocodb
spec:
  podSelector: {}
  ingress:
  - ports:
    - port: 15008
      protocol: TCP
  egress:
  - ports:
    - port: 15008
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inbound-http
  namespace: nocodb
spec:
  podSelector:
    matchLabels:
      app: nocodb
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
---
# NocoDB sends webhooks and fetches user-supplied URLs (attachments, imports).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nocodb-egress
  namespace: nocodb
spec:
  podSelector:
    matchLabels:
      app: nocodb
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
---
# k8up job pods need DNS, the API server (pod exec for the pg_dumpall backup
# command) and S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8up-egress
  namespace: nocodb
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
