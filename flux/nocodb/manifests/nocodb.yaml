apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nocodb-data
  namespace: nocodb
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nocodb
  namespace: nocodb
  labels:
    app: nocodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nocodb
  template:
    metadata:
      labels:
        app: nocodb
    spec:
      containers:
      - name: nocodb
        image: nocodb/nocodb:2026.09.1
        envFrom:
        - secretRef:
            name: nocodb-env
        env:
        # $(VAR) is expanded by kubernetes from the entries above and envFrom
        - name: NC_DB
          value: pg://postgres:5432?u=$(DATABASE_USER)&p=$(DATABASE_PASSWORD)&d=$(DATABASE_NAME)
        - name: NC_PUBLIC_URL
          value: https://nocodb.int.beansnet.net
        - name: NC_DISABLE_TELE
          value: "true"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /usr/app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nocodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: nocodb
  namespace: nocodb
  labels:
    app: nocodb
    istio.io/ingress-use-waypoint: "true"
spec:
  selector:
    app: nocodb
  ports:
  - port: 80
    targetPort: http
    name: http
