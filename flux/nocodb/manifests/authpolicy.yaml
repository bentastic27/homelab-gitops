apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nocodb
  namespace: nocodb
spec:
  action: ALLOW
  targetRefs:
  - kind: Service
    group: ""
    name: nocodb
  rules:
  - from:
    - source:
        namespaces:
        - istio-system
        - nocodb
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nocodb-postgres
  namespace: nocodb
spec:
  action: ALLOW
  targetRefs:
  - kind: Service
    group: ""
    name: postgres
  rules:
  - from:
    - source:
        namespaces:
        - nocodb
