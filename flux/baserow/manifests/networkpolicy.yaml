apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone
  namespace: baserow
spec:
  podSelector: {}
  ingress:
  - ports:
    - port: 15008
      protocol: TCP
  egress:
  - ports:
    - port: 15008
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inbound-http
  namespace: baserow
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - baserow-frontend
      - baserow-backend-wsgi
      - baserow-backend-asgi
      - minio
  ingress:
  - ports:
    - port: 3000
      protocol: TCP
    - port: 8000
      protocol: TCP
    - port: 9000
      protocol: TCP
---
# The backend and workers fetch user-supplied URLs (imports, webhooks, link previews).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-baserow-egress
  namespace: baserow
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - baserow-backend-wsgi
      - baserow-backend-asgi
      - baserow-celery-worker
      - baserow-celery-export-worker
      - baserow-celery-beat-worker
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
---
# k8up job pods need DNS, the API server (pod exec for the pg_dumpall backup
# command) and S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8up-egress
  namespace: baserow
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
