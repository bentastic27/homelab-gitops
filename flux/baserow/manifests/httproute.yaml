# Baserow expects separate hosts for the frontend, API and file storage; this
# serves all three from one hostname by path (the same layout as the all-in-one image).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: baserow-http
  namespace: baserow
spec:
  parentRefs:
  - name: internal-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: https
  hostnames:
  - baserow.int.beansnet.net
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/
    backendRefs:
    - name: baserow-baserow-backend-wsgi
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /ws/
    - path:
        type: PathPrefix
        value: /mcp/
    - path:
        type: PathPrefix
        value: /assistant/
    backendRefs:
    - name: baserow-baserow-backend-asgi
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /files/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: baserow-minio
      port: 9000
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: baserow-baserow-frontend
      port: 80
