apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: baserow-frontend
  namespace: baserow
spec:
  action: ALLOW
  targetRefs:
  - kind: Service
    group: ""
    name: baserow-baserow-frontend
  rules:
  - from:
    - source:
        namespaces:
        - istio-system
        - baserow
---
