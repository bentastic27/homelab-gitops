# Connection settings for the backend, loaded into every Baserow pod (and the
# migration job) through global.baserow.envFrom. The postgres statefulset reads
# its credentials from here too so the generated password is defined once.
# The chart generates its own JWT/SECRET_KEY secret (backend-secret).
apiVersion: v1
kind: Secret
metadata:
  name: baserow-env
  namespace: baserow
  annotations:
    secret-generator.v1.mittwald.de/type: string
    secret-generator.v1.mittwald.de/secure: "yes"
    secret-generator.v1.mittwald.de/autogenerate: DATABASE_PASSWORD
stringData:
  DATABASE_USER: baserow
  DATABASE_NAME: baserow
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
