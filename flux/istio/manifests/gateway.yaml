apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: beansnet
  namespace: istio-system
spec:
  secretName: beansnet-cert
  commonName: beansnet.net
  dnsNames:
  - beansnet.net
  - "*.beansnet.net"
  - "*.int.beansnet.net"
  issuerRef:
    name: letsencrypt-dns-cluster-issuer
    kind: ClusterIssuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-gateway-options
  namespace: istio-system
data:
  service: |
    metadata:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.19
    spec:
      externalTrafficPolicy: Local
      allocateLoadBalancerNodePorts: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-gateway-options
  namespace: istio-system
data:
  service: |
    metadata:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.20
    spec:
      externalTrafficPolicy: Local
      allocateLoadBalancerNodePorts: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: istio-system
  annotations:
    external-dns.kubernetes.io/target: "${publicIp:=0.0.0.0/0}"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: public-gateway-options
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: beansnet-cert
  # TLS passthrough for the kube-apiserver (see flux/k8s-api); SNI picks this
  # over the wildcard HTTPS listener above.
  - name: k8s-api
    protocol: TLS
    port: 443
    hostname: remotek8s.beansnet.net
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: default
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: istio-system
  annotations:
    external-dns.kubernetes.io/target: "192.168.1.20"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: internal-gateway-options
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: beansnet-cert
---
# Passes TLS straight through to the kube-apiserver so client certs keep working.
# remotek8s.beansnet.net is already in the RKE2 tls-san list.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: k8s-api
  namespace: default
spec:
  parentRefs:
  - name: public-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: k8s-api
  hostnames:
  - remotek8s.beansnet.net
  rules:
  - backendRefs:
    - name: kubernetes
      port: 443
