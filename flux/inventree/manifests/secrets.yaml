# Initial superuser. INVENTREE_ADMIN_* only seeds the account on first boot;
# changing the password later is done in the app. Read the generated password with:
#   kubectl -n inventree get secret inventree-admin -o jsonpath='{.data.INVENTREE_ADMIN_PASSWORD}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: inventree-admin
  namespace: inventree
  annotations:
    secret-generator.v1.mittwald.de/type: string
    secret-generator.v1.mittwald.de/secure: "yes"
    secret-generator.v1.mittwald.de/autogenerate: INVENTREE_ADMIN_PASSWORD
stringData:
  INVENTREE_ADMIN_USER: admin
  INVENTREE_ADMIN_EMAIL: admin@beansnet.net
