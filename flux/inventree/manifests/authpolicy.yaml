apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: inventree-https
  namespace: inventree
spec:
  action: ALLOW
  targetRefs:
  - kind: Service
    group: ""
    name: inventree
  rules:
  - from:
    - source:
        namespaces:
        - istio-system
