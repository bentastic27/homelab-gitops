apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inventree
  namespace: flux
spec:
  interval: 10m
  timeout: 10m
  releaseName: inventree
  targetNamespace: inventree
  install:
    createNamespace: false
  chart:
    spec:
      chart: inventree
      version: '0.4.31'
      sourceRef:
        kind: HelmRepository
        name: inventree
      interval: 5m
  values:
    global:
      siteUrl: https://inventree.int.beansnet.net
      adminSecret: inventree-admin
      dbSecrets:
      - name: INVENTREE_DB_ENGINE
        value: postgresql
      - name: INVENTREE_DB_NAME
        value: inventree
      - name: INVENTREE_DB_HOST
        value: postgres
      - name: INVENTREE_DB_PORT
        value: "5432"
      - name: INVENTREE_DB_USER
        valueFrom:
          secretKeyRef:
            name: postgres
            key: username
      - name: INVENTREE_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres
            key: password
      cacheSecrets:
      - name: INVENTREE_CACHE_HOST
        value: valkey
      - name: INVENTREE_CACHE_PORT
        value: "6379"
    # Plugins come from the inventree-plugins ConfigMap (plugins.yaml) instead of
    # the writable plugins.txt on the data volume, so they're managed in git.
    env:
      INVENTREE_PLUGIN_FILE: /etc/inventree/plugins.txt
      # activates the plugin on boot so it doesn't need enabling in Admin > Plugins
      INVENTREE_PLUGINS_MANDATORY: inventree-mcp
    volumes:
    - name: plugins-file
      configMap:
        name: inventree-plugins
    volumeMounts:
    - name: plugins-file
      mountPath: /etc/inventree
      readOnly: true
    resources:
      requests:
        memory: 512Mi
    worker:
      # the chart doesn't default this and renders `replicas:` empty otherwise
      replicaCount: 1
      volumes:
      - name: plugins-file
        configMap:
          name: inventree-plugins
      volumeMounts:
      - name: plugins-file
        mountPath: /etc/inventree
        readOnly: true
      resources:
        requests:
          memory: 256Mi
    persistence:
      size: 10Gi
      storageClass: openebs-hostpath
      annotations:
        k8up.io/backup: "true"
  postRenderers:
  - kustomize:
      patches:
      - target:
          version: v1
          kind: Service
          name: inventree
        patch: |
          - op: add
            path: /metadata/labels/istio.io~1ingress-use-waypoint
            value: "true"
