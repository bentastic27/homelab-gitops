apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone
  namespace: inventree
spec:
  podSelector: {}
  ingress:
  - ports:
    - port: 15008
      protocol: TCP
  egress:
  - ports:
    - port: 15008
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inbound-http
  namespace: inventree
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventree
  ingress:
  - ports:
    - port: 80
      protocol: TCP
    - port: 8000
      protocol: TCP
---
# InvenTree fetches currency exchange rates and installs plugins from PyPI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inventree-egress
  namespace: inventree
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - inventree
      - inventree-worker
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
---
# k8up job pods need DNS, the API server (pod exec for the pg_dumpall backup
# command) and S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8up-egress
  namespace: inventree
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
